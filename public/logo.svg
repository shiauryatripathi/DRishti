<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft 3D Ground Drop Shadow Filter -->
    <filter id="groundShadow" x="-20%" y="-20%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="6" dy="18" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Deep Ambient Occlusion Filter -->
    <filter id="softOcclusion" x="-30%" y="-30%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="2" dy="8" />
      <feComponentTransfer><feFuncA type="linear" slope="0.25" /></feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients for Upper Eyelid Ribbon -->
    <linearGradient id="upperEyelidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Specular Highlight for Upper Eyelid -->
    <linearGradient id="eyelidHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Gradients for Sweeping Orbital Ring -->
    <linearGradient id="orbitalRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="25%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Lower Eye Contour Gradient -->
    <linearGradient id="lowerContourGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Iris Radial Gradient -->
    <radialGradient id="irisGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="35%" stop-color="#0ea5e9" />
      <stop offset="75%" stop-color="#0284c7" />
      <stop offset="92%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Star Diamond Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Text 3D Gradients -->
    <linearGradient id="textDRGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="textIshtiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <g id="drishti3DLogo" filter="url(#groundShadow)">
    
    <!-- ==================== EYE EMBLEM GROUP ==================== -->
    <g id="eyeEmblem" transform="translate(0, -10)">
      
      <!-- 1. Sweeping Lower & Orbital Ring (Back & Swoop) -->
      <path 
        d="M 330 290 
           C 290 280 270 240 310 200 
           C 360 150 490 130 550 160 
           C 575 172 585 195 565 210
           C 535 230 460 215 410 230
           C 350 250 310 280 335 292
           C 350 298 385 292 420 280
           C 475 260 515 230 540 200
           C 520 225 465 270 380 290
           Z"
        fill="url(#orbitalRingGrad)" 
        opacity="0.95"
      />

      <!-- 2. Dynamic 3D Orbit Ribbon swooshing to the Star -->
      <path
        d="M 320 270
           C 305 285 330 300 370 295
           C 435 288 505 240 545 190
           C 560 170 568 152 575 140
           C 568 155 550 190 515 228
           C 460 280 380 305 320 270
           Z"
        fill="url(#lowerContourGrad)"
      />

      <!-- 3. Upper Curved Eyelid Ribbon (Glossy 3D) -->
      <path 
        d="M 305 225
           C 330 180 400 135 500 150
           C 545 158 575 178 580 190
           C 570 175 535 150 480 142
           C 390 130 325 185 305 225
           Z"
        fill="url(#upperEyelidGrad)"
      />
      <!-- Specular ridge highlight along upper eyelid -->
      <path 
        d="M 320 210
           C 345 175 405 140 485 145
           C 525 148 550 160 565 170
           C 545 158 515 147 480 144
           C 400 138 340 180 320 210
           Z"
        fill="url(#eyelidHighlight)"
        opacity="0.9"
      />

      <!-- 4. Lower Eye Arch Line -->
      <path 
        d="M 325 220
           C 350 250 420 285 505 240
           C 525 230 540 215 545 205
           C 530 220 500 248 440 255
           C 380 262 338 238 325 220
           Z"
        fill="url(#lowerContourGrad)"
      />

      <!-- 5. Central 3D Eyeball & Iris Assembly -->
      <g id="eyeballCenter" filter="url(#softOcclusion)">
        <!-- Outer Eye Sclera Ambient Base -->
        <ellipse cx="435" cy="225" rx="55" ry="50" fill="#f0f9ff" opacity="0.3" />

        <!-- 3D Blue Iris -->
        <circle cx="435" cy="225" r="42" fill="url(#irisGrad)" />
        
        <!-- Iris Inner Depth Ring -->
        <circle cx="435" cy="225" r="32" fill="#0284c7" opacity="0.5" />

        <!-- Deep Midnight Pupil -->
        <circle cx="435" cy="225" r="22" fill="#091428" />

        <!-- Photorealistic Specular Catchlights (Specular White Dots) -->
        <ellipse cx="446" cy="214" rx="7" ry="5.5" fill="#ffffff" transform="rotate(-25 446 214)" />
        <circle cx="426" cy="235" r="2.8" fill="#ffffff" opacity="0.65" />
      </g>

      <!-- 6. Sparkling 4-Pointed Star / Diamond at the Top-Right Apex -->
      <g id="sparkleStar" transform="translate(570, 140)" filter="url(#starGlow)">
        <!-- Outer Star Glow Flares -->
        <path 
          d="M 0 -24 
             Q 0 0 24 0 
             Q 0 0 0 24 
             Q 0 0 -24 0 
             Q 0 0 0 -24 Z" 
          fill="url(#starGrad)"
        />
        <!-- Center Hot White Specular Core -->
        <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
        <!-- Micro Accent Sparkle -->
        <circle cx="16" cy="-12" r="1.5" fill="#38bdf8" opacity="0.8" />
      </g>

    </g>

    <!-- ==================== TYPOGRAPHY GROUP ==================== -->
    <g id="brandTypography">
      <!-- "DR" in Deep Navy -->
      <text 
        x="330" 
        y="355" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="62" 
        font-weight="900" 
        letter-spacing="-1.5"
        fill="url(#textDRGrad)"
      >
        DR
      </text>

      <!-- "ishti" in Vibrant Sky Blue -->
      <text 
        x="425" 
        y="355" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="62" 
        font-weight="700" 
        letter-spacing="-1"
        fill="url(#textIshtiGrad)"
      >
        ishti
      </text>

      <!-- Tagline: "— INSIGHTS FOR A BETTER TOMORROW —" -->
      <g transform="translate(400, 385)">
        <!-- Left Horizontal Accent Line -->
        <line x1="-155" y1="-4" x2="-120" y2="-4" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
        
        <!-- Centered Tagline Text -->
        <text 
          x="0" 
          y="0" 
          text-anchor="middle"
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" 
          font-weight="800" 
          letter-spacing="3"
          fill="#1e3a8a"
        >
          INSIGHTS FOR A BETTER TOMORROW
        </text>

        <!-- Right Horizontal Accent Line -->
        <line x1="120" y1="-4" x2="155" y2="-4" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>

  </g>
</svg>
